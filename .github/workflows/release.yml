name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A manually requested build can only upload workflow artifacts. The separate
# tag-only publishing job below receives the release write permission.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  build:
    name: Validate and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Selecting Rust failed.' }

      - name: Validate package and tag versions
        id: version
        run: |
          $releaseVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Reading Cargo version failed.' }
          $releaseVersion = "$releaseVersion".Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release assets require a stable major.minor.patch Cargo version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$releaseVersion") {
            throw "The tag must exactly match v$releaseVersion."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$releaseVersion" -Encoding utf8

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run simulated tests with locked dependencies
        run: cargo test --locked --all-targets

      - name: Check contrast audit implementation
        run: python tools/check-ui-contrast.py --self-test

      - name: Check UI contrast
        run: python tools/check-ui-contrast.py

      - name: Locate Inno Setup 6 or install verified compiler
        id: inno
        run: |
          $isccPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $compilerUsable = Test-Path -LiteralPath $isccPath -PathType Leaf
          if ($compilerUsable) {
            $compilerVersion = (Get-Item -LiteralPath $isccPath).VersionInfo
            $compilerUsable = $compilerVersion.FileMajorPart -eq 6 -and $compilerVersion.FileMinorPart -ge 5
          }
          if (-not $compilerUsable) {
            $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $compilerInstaller
            # Digest from the matching official jrsoftware/issrc release asset.
            $compilerHash = (Get-FileHash -LiteralPath $compilerInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($compilerHash -cne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') {
              throw 'The downloaded Inno Setup compiler did not match its pinned SHA-256.'
            }
            $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
            $compilerProcess = Start-Process -FilePath $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDirectory`"") -WindowStyle Hidden -PassThru -Wait
            if ($compilerProcess.ExitCode -ne 0) { throw 'Installing Inno Setup failed.' }
            $isccPath = Join-Path $compilerDirectory 'ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw 'ISCC.exe was not found after compiler setup.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$isccPath" -Encoding utf8

      - name: Build native executable and installer
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
        run: ./tools/build-installer.ps1 -IsccPath $env:ISCC_PATH

      - name: Smoke-test installer on disposable hosted runner
        timeout-minutes: 5
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./tools/test-installer.ps1 -SetupPath "dist/campus-network-guardian-${env:RELEASE_VERSION}-windows-x64-setup.exe" -ExpectedVersion $env:RELEASE_VERSION

      - name: Validate versions and package portable files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION
          $assetPrefix = "campus-network-guardian-$releaseVersion-windows-x64"
          $nativeExe = Get-Item -LiteralPath 'target/installer-build/x86_64-pc-windows-msvc/release/campus-network-guardian.exe'
          $setupExe = Get-Item -LiteralPath "dist/$assetPrefix-setup.exe"
          $versionPattern = '^' + [regex]::Escape($releaseVersion) + '(?:\.0)?$'
          foreach ($binary in @($nativeExe, $setupExe)) {
            if ($binary.VersionInfo.ProductVersion -notmatch $versionPattern -or $binary.VersionInfo.FileVersion -notmatch $versionPattern) {
              throw "The embedded version in $($binary.Name) does not match Cargo $releaseVersion."
            }
          }

          # Stage only this allowlist; never archive the checkout or user data.
          $portableDirectory = Join-Path $env:RUNNER_TEMP "campus-guardian-portable-$releaseVersion"
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          Copy-Item -LiteralPath $nativeExe.FullName -Destination (Join-Path $portableDirectory 'campus-network-guardian.exe')
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $portableDirectory 'README.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $portableDirectory 'LICENSE')
          Copy-Item -LiteralPath 'THIRD-PARTY-NOTICES.md' -Destination (Join-Path $portableDirectory 'THIRD-PARTY-NOTICES.md')
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "dist/$assetPrefix-portable.zip"
          $portableFiles = @('campus-network-guardian.exe', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md') | ForEach-Object { Join-Path $portableDirectory $_ }
          Compress-Archive -LiteralPath $portableFiles -DestinationPath $portableZip -Force

          $checksums = foreach ($asset in @($setupExe.FullName, $portableZip)) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Value $checksums -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/campus-network-guardian-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/campus-network-guardian-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/SHA256SUMS.txt

  publish:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Publish installer, portable archive, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $assetPrefix = "campus-network-guardian-${env:RELEASE_VERSION}-windows-x64"
          $releaseAssets = @(
            (Get-Item -LiteralPath "release-assets/$assetPrefix-setup.exe").FullName,
            (Get-Item -LiteralPath "release-assets/$assetPrefix-portable.zip").FullName,
            (Get-Item -LiteralPath 'release-assets/SHA256SUMS.txt').FullName
          )
          gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --title "校园网守护 $env:RELEASE_TAG" --generate-notes @releaseAssets
          if ($LASTEXITCODE -ne 0) { throw 'Creating the GitHub release failed. Existing releases are not overwritten.' }
